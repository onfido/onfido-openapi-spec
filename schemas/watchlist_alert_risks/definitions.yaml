watchlist_alert_risk:
  type: object
  properties:
    created_at:
      type: string
      format: date-time
      description: The date and time at which the risk record was created.
    decision:
      allOf:
        - $ref: "#/risk_decision"
      description: The review decision currently applied to the risk.
    previous_decision:
      nullable: true
      allOf:
        - $ref: "#/risk_decision"
      description: The previous review decision, if one exists.
    detail:
      allOf:
        - $ref: "#/risk_detail"
      description: Additional details about the risk.
    identifier:
      type: string
      description: The unique identifier of the risk record.
    type:
      type: string
      description: The type of risk returned for the alert.
    updated_by:
      type: string
      nullable: true
      description: The identifier of the user or system that last updated the risk decision.
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: The date and time at which the risk record was last updated.

risk_decision:
  type: string
  enum:
    - NOT_REVIEWED
    - IN_REVIEW
    - FALSE_POSITIVE
    - TRUE_POSITIVE

risk_detail:
  type: object
  properties:
    change_type:
      type: string
      nullable: true
      description: The type of change that triggered the risk, if available.
    configuration_identifier:
      type: string
      format: uuid
      nullable: true
      description: The identifier of the screening configuration associated with the risk.
    profile:
      nullable: true
      allOf:
        - $ref: "#/profile"
      description: The matched profile associated with the risk.
    added_mentions:
      nullable: true
      allOf:
        - $ref: "#/added_mentions"
      description: Newly added mentions associated with the risk.

added_mentions:
  type: object
  properties:
    added_aml_types:
      type: array
      nullable: true
      items:
        type: string
    added_snippets:
      type: array
      nullable: true
      items:
        type: string
    added_listings:
      type: array
      nullable: true
      items:
        type: string

profile:
  type: object
  properties:
    identifier:
      type: string
      nullable: true
    match_types:
      type: array
      nullable: true
      items:
        type: string
    match_score:
      type: number
      description: The match score assigned to the profile.
    matching_name:
      type: string
      nullable: true
    person:
      nullable: true
      allOf:
        - $ref: "#/person"
    risk_indicators:
      nullable: true
      allOf:
        - $ref: "#/risk_indicators"

person:
  type: object
  properties:
    associates:
      type: array
      nullable: true
      items:
        $ref: "#/associate"
    dates_of_birth:
      type: array
      nullable: true
      items:
